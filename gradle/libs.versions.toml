[versions]
activityCompose = "1.13.0"
annotation = "1.10.0"
appcompat = "1.8.0"
biometric = "1.1.0"
agp = "9.5.1"
composeBom = "2026.09.00"
coreKtx = "1.19.1"
composeRulesDetekt = "0.6.8"
coreSplashscreen = "1.2.0"
detekt = "2.0.0-alpha.6"
espressoCore = "3.7.0"
junit = "4.13.2"
junitVersion = "1.3.0"
kotlin = "2.4.21"
kotlinSerialization = "2.4.21"
kotlinxSerialization = "1.12.0"
ktfmt = "0.64"
kotlinxCoroutines = "1.11.0"
# What the app already resolves at runtime; core modules declare it without changing the APK.
kotlinxCoroutinesCore = "1.10.2"
ksp = "2.3.12"
lifecycleRuntimeKtx = "2.11.0"
lifecycleViewmodelCompose = "2.11.0"
material = "1.14.0"
navigationCompose = "2.10.2"
ossLicenses = "0.13.0"
playServicesOssLicenses = "17.5.3"
room = "2.8.5"
spotless = "8.11.0"
robolectric = "4.17"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }

# Dependabot version updates for Kupass.
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  # Gradle: version catalog (gradle/libs.versions.toml), plugins, and the Gradle wrapper.
  - package-ecosystem: gradle
    directory: /
    target-branch: compose
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: build
      include: scope
    groups:
      # Kotlin, the Compose compiler plugin, serialization plugin, and KSP must move together.
      kotlin:
        patterns:
          - org.jetbrains.kotlin*
          - com.google.devtools.ksp*
      agp:
        patterns:
          - com.android.application
          - com.android.tools.build*
      androidx:
        patterns:
          - androidx.*
      test:
        patterns:
          - junit*
          - org.robolectric*
      other:
        patterns:
          - "*"
        exclude-patterns:
          - org.jetbrains.kotlin*
          - com.google.devtools.ksp*
          - com.android.application
          - com.android.tools.build*
          - androidx.*
          - junit*
          - org.robolectric*

  # GitHub Actions: keeps the SHA-pinned actions in .github/workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    target-branch: compose
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

name: Feature request
description: Suggest an idea for Kupass.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Kupass works offline and collects no data. Cloud sync, accounts, analytics, and sharing passwords between users are out of scope for now.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: When I ..., I can't ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like Kupass to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for this idea.
          required: true

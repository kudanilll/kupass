# Builds a signed release APK and publishes a GitHub Release when a version tag is pushed.
#
# Trigger: `git tag v3.1.0 && git push origin v3.1.0` for a stable release, or
# `git tag v3.1.0-beta.1 && git push origin v3.1.0-beta.1` for a beta, published as a prerelease.
# The tag's version must match `versionName` in app/build.gradle.kts. The build takes versionCode
# from the tag (build-logic/convention/.../ReleaseVersion.kt), so each beta updates to the next
# one and to the stable release.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_BASE64  base64 of release-key.jks   (e.g. `base64 -w0 release-key.jks`)
#   RELEASE_STORE_PASSWORD   keystore password
#   RELEASE_KEY_ALIAS        key alias
#   RELEASE_KEY_PASSWORD     key password
# Optional:
#   FAVGET_API_KEY           enables opt-in site icons; without it the feature is hidden
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

# Deny everything by default; the job below opts into the single scope it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release and upload assets
    environment: release
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches versionName
        run: |
          # Fails fast; the Gradle build checks the same tag again when it derives versionCode.
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-beta\.[1-9][0-9]?)?$ ]]; then
            echo "::error::Tag ${TAG} is not vX.Y.Z or vX.Y.Z-beta.N"
            exit 1
          fi
          tag_version=${BASH_REMATCH[1]}
          prerelease=false
          if [ -n "${BASH_REMATCH[2]}" ]; then
            prerelease=true
          fi
          version_name=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "${tag_version}" != "${version_name}" ]; then
            echo "::error::Tag ${TAG} does not match versionName ${version_name} in app/build.gradle.kts"
            exit 1
          fi
          echo "PRERELEASE=${prerelease}" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Release builds never write to the cache, so a tag push can't poison it for other runs.
          cache-read-only: true

      - name: Restore signing config
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          FAVGET_API_KEY: ${{ secrets.FAVGET_API_KEY }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_STORE_PASSWORD" ] \
            || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            # Without these, app/build.gradle.kts silently falls back to debug signing.
            echo "::error::Release signing secrets are missing"
            exit 1
          fi
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          {
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$RELEASE_KEY_PASSWORD"
            if [ -n "$FAVGET_API_KEY" ]; then
              printf 'FAVGET_API_KEY=%s\n' "$FAVGET_API_KEY"
            fi
          } > secrets.properties
          if [ -z "$FAVGET_API_KEY" ]; then
            echo "::warning::FAVGET_API_KEY is not set; site icons will be unavailable"
          fi

      - name: Test
        # AGP 9 only creates unit tests for the tested (debug) build type.
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -Pkupass.releaseTag="$TAG" --console=plain

      - name: Verify APK is release-signed
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          # Shows the versionCode the tag produced.
          badging=$("${build_tools}aapt2" dump badging "$apk")
          echo "$badging" | grep "^package:"
          certs=$("${build_tools}apksigner" verify --print-certs "$apk")
          # "Signer #1 certificate DN:" before build-tools 37, "V2 Signer: certificate DN:" since.
          echo "$certs" | grep -E "certificate (DN|SHA-256 digest):"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::APK is signed with the debug key"
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/kupass-${TAG}.apk"
          (cd dist && sha256sum "kupass-${TAG}.apk" > "kupass-${TAG}.apk.sha256")

      - name: Remove signing material
        if: always()
        run: rm -f release-key.jks secrets.properties

      - name: Extract release notes from CHANGELOG.md
        run: |
          # Section between "## [<version>]" and the next "## [" heading.
          section() {
            awk -v v="$1" '
              index($0, "## [" v "]") == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
          }
          section "${TAG#v}" > release-notes.md
          # A beta without its own section ships everything not released yet.
          if [ ! -s release-notes.md ] && [ "$PRERELEASE" = true ]; then
            section Unreleased > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG.md section for ${TAG#v}; using generated notes"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s release-notes.md ]; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi
          prerelease=()
          if [ "$PRERELEASE" = true ]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kupass ${TAG}" \
            --verify-tag \
            "${notes[@]}" \
            "${prerelease[@]}" \
            "dist/kupass-${TAG}.apk" \
            "dist/kupass-${TAG}.apk.sha256"

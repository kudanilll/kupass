# Continuous integration: formatting, static analysis, build, unit tests, and lint for every push
# to master and every PR.
# Fork PRs run with a read-only token and no secrets; no job here needs secrets.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Deny everything by default; each job opts into what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Format, analyze, build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        # Cache is written only from master; PR builds read it (default behavior).
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check formatting (ktfmt via Spotless)
        run: ./gradlew spotlessCheck --console=plain

      - name: Static analysis (detekt + Compose rules)
        run: ./gradlew detektMain detektTest --console=plain

      - name: Build, unit test, lint
        run: ./gradlew assembleDebug :app:assembleRelease testDebugUnitTest :build-logic:convention:test lintDebug --console=plain

      - name: Record APK size
        # R8-minified release build. Without secrets it is debug-signed, which barely changes the size.
        run: |
          bytes=$(stat -c %s app/build/outputs/apk/release/app-release.apk)
          printf '### Release APK size\n\n%s bytes (%s KiB)\n' "$bytes" "$((bytes / 1024))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  dependency-submission:
    # Feeds the GitHub dependency graph so Dependabot alerts cover Gradle dependencies.
    name: Submit dependency graph
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # required by the Dependency Submission API
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
